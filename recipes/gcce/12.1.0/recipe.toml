# GCC4Symbian at fe1b15a, each needed (experiment 107): libgcc/libgcov-driver.c with a
# fallback `__INTPTR_TYPE__`, which arm-none-symbianelf does not predefine (pristine:
# libgcov fails to compile); sys-include/stdint.h (without it libsupc++'s new_opa.cc does
# not compile); sys-include/stdio.h (without it libstdc++'s header checks fail and the
# installed c++config.h loses _GLIBCXX_HAVE_{FLOAT,STDALIGN,STDBOOL,STDINT}_H).
[[source]]
url = "https://raw.githubusercontent.com/fedor4ever/GCC4Symbian/fe1b15a1c25716d5c515f12593080d58f14d4c3f/build-data/GCC-12.1.0/libgcov-driver.c"
