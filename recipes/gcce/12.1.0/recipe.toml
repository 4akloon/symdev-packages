# gcce;12.1.0 — GNU binutils 2.29.1 and GCC 12.1.0 for arm-none-symbianelf, one prefix.
#
# Reproduces the toolchain symdev was developed with (a GCC 12.1.0 built by
# fedor4ever/GCC4Symbian's build-toolchain.sh); the steps and flags in build.sh
# are the ones recovered from that build (symdev experiment 107). build.sh reads the
# [[source]] tables below: `url` first, then `sha256`; the file name is the URL's last
# path segment.
#
# Every [[source]] is an official GNU tarball. The three files that build took from
# GCC4Symbian are replaced by ours, written from GCC's requirements (symdev experiment
# 108): sys-include/stdint.h and sys-include/stdio.h next to this file, and instead of a
# changed libgcc/libgcov-driver.c, build.sh's CFLAGS_FOR_TARGET defines the
# __INTPTR_TYPE__ that arm-none-symbianelf does not predefine.
id = "gcce;12.1.0"
license = "GPL-3.0-or-later AND MIT"
host = "x86_64-linux"
build = "build.sh"

[[source]]
url = "https://ftp.gnu.org/gnu/gcc/gcc-12.1.0/gcc-12.1.0.tar.xz"
sha256 = "62fd634889f31c02b64af2c468f064b47ad1ca78411c45abe6ac4b5f8dd19c7b"

[[source]]
url = "https://ftp.gnu.org/gnu/binutils/binutils-2.29.1.tar.xz"
sha256 = "e7010a46969f9d3e53b650a518663f98a5dde3c3ae21b7d71e5e6803bc36b577"

# GCC's prerequisites, built in-tree (statically linked into cc1/cc1plus, so the package
# needs no libgmp/libmpfr/libmpc on the user's machine). Versions are the ones
# GCC4Symbian unpacked into the GCC tree.
[[source]]
url = "https://ftp.gnu.org/gnu/gmp/gmp-6.1.0.tar.bz2"
sha256 = "498449a994efeba527885c10405993427995d3f86b8768d8cdf8d9dd7c6b73e8"

[[source]]
