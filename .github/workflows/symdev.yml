# The prebuilt symdev and its Rust SDK (symdev spec 2026-10-02 §12): recipes/symdev/<ver>/
# names a tag of 4akloon/symdev; build.sh builds a static x86_64 musl symdev from it and
# stages the tag's tree. From 0.3.0 the recipe also has prebuilt.sh, which compiles the
# rust-sdk's prebuilt/ (symdev experiment 109) with GCCE and the S60 SDK that the symdev just
# built installs here. Every run packs both packages with `publish --dry-run` against the
# public index (an id already published fails here); a push to main (merging the recipe is
# the release) or a manual run then uploads rust-sdk;<ver> and, after it, symdev;<ver>, so
# the index never offers a symdev whose Rust SDK is missing.
#
# The two uploads are separate jobs on purpose: publish refuses an id already in the index,
# so if symdev's upload fails after rust-sdk's went through, "Re-run failed jobs" repeats
# only symdev's.
#
# Settings, as for GCCE (publish.yml): repository variable PUBLIC_READ_URL (the public
# bucket's r2.dev URL, read by the dry run; unset = empty index); environment `publish`
# (main only) with variable PUBLISH_PUBLIC_URL and secrets PUBLISH_ACCESS_KEY_ID,
# PUBLISH_SECRET_ACCESS_KEY and PUBLISH_SIGNING_KEY (the index signing key, symdev spec §14:
# given only to the two steps that write the index; the dry runs print an unsigned index and
# the install.sh uploads do not touch it). For prebuilt.sh, the build job also needs
# repository variable SYMDEV_PRIVATE_SOURCE_URL (the private bucket's S3 URL) and repository
# secrets SYMDEV_SOURCE_PRIVATE_ACCESS_KEY_ID and SYMDEV_SOURCE_PRIVATE_SECRET_ACCESS_KEY (the
# private bucket's reader key, the one symdev's CI has), given only to the step that installs
# the SDK.
#
# install.sh (spec §12) lives at the public bucket's root: publish-symdev uploads it last,
# after symdev;<ver> is in the index, and a manual run with `install_sh_only` uploads only
# it (after a fix to install.sh, without a release).
name: symdev

on:
  pull_request:
    paths:
      - "recipes/symdev/**"
      - "publish/**"
      - "pkgtools/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/symdev.yml"
  push:
    branches: [main]
    paths:
      - "recipes/symdev/**"
  workflow_dispatch:
    inputs:
      version:
        description: "The recipe to build and publish: recipes/symdev/<version> (not used with install_sh_only)"
        required: false
      install_sh_only:
        description: "Only upload install.sh to the public bucket's root; build and publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.install_sh_only
    # A static binary does not depend on the runner's glibc, so no container is needed.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.recipe.outputs.version }}
    env:
      # What prebuilt.sh compiles with: the GCCE its GCC version check expects, and the SDK
      # symdev builds for the E52 with (symdev's pins). Installed at
      # $SYMDEV_HOME/<id with ; as />.
      GCCE_ID: "gcce;12.1.0"
      SDK_ID: "sdk;s60-3rd-fp2;1.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The recipe directory the change touches; a change to the publisher or this workflow
      # alone checks the newest recipe. One release per change.
      - name: Choose the recipe
        id: recipe
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          versions=
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -z "$INPUT_VERSION" ]; then
              echo "::error::give the version of the recipe to release (recipes/symdev/<version>), or set install_sh_only"
              exit 1
            fi
            versions=$INPUT_VERSION
          elif git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            versions=$(git diff --name-only "$BASE" HEAD -- recipes/symdev/ | cut -d/ -f3 | sort -u)
          fi
          if [ -z "$versions" ]; then
            versions=$(ls recipes/symdev | sort -V | tail -n 1)
          fi
          if [ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::this change touches several symdev recipes ($(echo $versions)); release one per change"
            exit 1
          fi
          case $versions in
            *[!0-9A-Za-z.+-]* | "") echo "::error::'$versions' is not a version"; exit 1 ;;
          esac
          if [ ! -f "recipes/symdev/$versions/recipe.toml" ]; then
            echo "::error::recipes/symdev/$versions/recipe.toml does not exist"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"
          if [ -f "recipes/symdev/$versions/prebuilt.sh" ]; then
            echo "prebuilt=true" >> "$GITHUB_OUTPUT"
          fi

      # musl-gcc: ring and libz-sys compile C for the musl target (cc-rs finds musl-gcc).
      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # Pinned like symdev's CI (workspace rust-version); bump both together.
      - name: Install Rust 1.98.1 with the musl target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.98.1

      # Once for the job: publish packs and checks, pkgtools is every other tool the job runs
      # (build.sh's notices, prebuilt.sh's case-fold overlay, TARGET2 rewrite and closure
      # check, the SDK check of the artifact).
      - name: Build this repository's tools
        run: |
          cargo build --release --locked -p publish -p pkgtools
          echo "PUBLISH=$GITHUB_WORKSPACE/target/release/publish" >> "$GITHUB_ENV"
          echo "PKGTOOLS=$GITHUB_WORKSPACE/target/release/pkgtools" >> "$GITHUB_ENV"

      - name: Build symdev and stage the Rust SDK
        env:
          VERSION: ${{ steps.recipe.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          bash "$GITHUB_WORKSPACE/recipes/symdev/$VERSION/build.sh" "$RUNNER_TEMP/out"

      # prebuilt.sh's toolchain: GCCE from the public bucket, the S60 SDK from the owner's
      # private one, both installed by the symdev just built (a symdev from 0.2.0 on reads
      # `key = "builtin"`: the private index must be signed by symdev's own key). Everything
      # goes under $RUNNER_TEMP/toolchain, outside the workspace and outside out/, and nothing
      # is cached: the SDK's licence does not let it be passed on, so it must not reach the
      # artifact or a cache that a pull request could restore.
      - name: Configure the private source
        if: steps.recipe.outputs.prebuilt == 'true'
        env:
          URL: ${{ vars.SYMDEV_PRIVATE_SOURCE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::repository variable SYMDEV_PRIVATE_SOURCE_URL is not set; prebuilt.sh needs the S60 SDK from the private source"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/toolchain/config/symdev"
          printf '[[source]]\nname = "private"\nurl = "%s"\nauth = "s3"\nkey = "builtin"\n' "$URL" \
            > "$RUNNER_TEMP/toolchain/config/symdev/sources.toml"

      # The only step that holds the reader key, and it runs only the symdev just built: the
      # build scripts of third-party crates ran in the step before, without it.
      - name: Install GCCE and the S60 SDK
        if: steps.recipe.outputs.prebuilt == 'true'
        env:
          SYMDEV_SOURCE_PRIVATE_ACCESS_KEY_ID: ${{ secrets.SYMDEV_SOURCE_PRIVATE_ACCESS_KEY_ID }}
          SYMDEV_SOURCE_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.SYMDEV_SOURCE_PRIVATE_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$SYMDEV_SOURCE_PRIVATE_ACCESS_KEY_ID" ]; then
            echo "::error::no reader key of the private source (secret SYMDEV_SOURCE_PRIVATE_ACCESS_KEY_ID; a fork gets none); prebuilt.sh needs the S60 SDK"
            exit 1
          fi
          export SYMDEV_HOME="$RUNNER_TEMP/toolchain/home" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/toolchain/config" \
            XDG_CACHE_HOME="$RUNNER_TEMP/toolchain/cache"
          "$RUNNER_TEMP/out/symdev/bin/symdev" sdk install "$GCCE_ID" "$SDK_ID"

      # Writes out/rust-sdk/symbian-rs/prebuilt (lib/ and the notices); its work files, the
      # SDK's case-fold overlay among them, stay in $RUNNER_TEMP/work/prebuilt-work.
      - name: Build rust-sdk's prebuilt set
        if: steps.recipe.outputs.prebuilt == 'true'
        env:
          VERSION: ${{ steps.recipe.outputs.version }}
        run: |
          home=$RUNNER_TEMP/toolchain/home
          cd "$RUNNER_TEMP/work"
          bash "$GITHUB_WORKSPACE/recipes/symdev/$VERSION/prebuilt.sh" symdev \
            "$home/${GCCE_ID//;//}" "$home/${SDK_ID//;//}" \
            "$RUNNER_TEMP/out/rust-sdk/symbian-rs/prebuilt"

      # publish writes the archive into its current directory: $RUNNER_TEMP/artifact/packed,
      # beside the build's tar, so that directory is all the artifact takes.
      - name: Pack both packages (dry run)
        env:
          VERSION: ${{ steps.recipe.outputs.version }}
          PUBLISH_PUBLIC_URL: ${{ vars.PUBLIC_READ_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifact/packed"
          cd "$RUNNER_TEMP/artifact/packed"
          for kind in rust-sdk symdev; do
            "$PUBLISH" public "$kind;$VERSION" \
              --from "$RUNNER_TEMP/out/$kind" \
              --source-code "$RUNNER_TEMP/out/symdev-$VERSION-source.tar.gz" \
              --recipe "$GITHUB_WORKSPACE/recipes/symdev/$VERSION/recipe.toml" --dry-run
          done

      # The command publish-symdev ends with, checked here so a mistake shows up in the PR.
      - name: Check the install.sh upload (dry run)
        run: |
          "$PUBLISH" file install.sh --to install.sh \
            --bucket public --content-type "text/plain; charset=utf-8" \
            --cache-control no-cache --dry-run

      # An artifact does not keep file modes; a tar does (bin/symdev stays executable).
      - name: Hand the build to the publish jobs
        run: |
          mkdir -p "$RUNNER_TEMP/artifact"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/artifact/symdev-out.tar" out

      # Every file of the artifact, the members of its archives too, against every file of
      # the SDK installed above: fails on the same bytes under any name, or a path through
      # epoc32/. Only what prebuilt.sh compiled from the SDK's headers may leave the runner.
      - name: Check that the artifact holds no file of the S60 SDK
        if: steps.recipe.outputs.prebuilt == 'true'
        run: |
          "$PKGTOOLS" sdk-free "$RUNNER_TEMP/toolchain/home/${SDK_ID//;//}" \
            "$RUNNER_TEMP/artifact"

      # symdev-out.tar and packed/<sha256>.tar.gz, nothing else.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: symdev-build
          path: ${{ runner.temp }}/artifact/
          if-no-files-found: error
          retention-days: 7

  publish-rust-sdk:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment: publish
    # The index is read, extended and written back: one publish at a time.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: symdev-build
          path: ${{ runner.temp }}/symdev-build

      - name: Unpack the build
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/symdev-build/symdev-out.tar"

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Publish rust-sdk
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PUBLISH_PUBLIC_URL: ${{ vars.PUBLISH_PUBLIC_URL }}
          PUBLISH_ACCESS_KEY_ID: ${{ secrets.PUBLISH_ACCESS_KEY_ID }}
          PUBLISH_SECRET_ACCESS_KEY: ${{ secrets.PUBLISH_SECRET_ACCESS_KEY }}
          PUBLISH_SIGNING_KEY: ${{ secrets.PUBLISH_SIGNING_KEY }}
        run: |
          cargo run --release --locked -p publish -- public "rust-sdk;$VERSION" \
            --from "$RUNNER_TEMP/out/rust-sdk" \
            --source-code "$RUNNER_TEMP/out/symdev-$VERSION-source.tar.gz" \
            --recipe "recipes/symdev/$VERSION/recipe.toml"

  publish-symdev:
    if: github.event_name != 'pull_request'
    needs: [build, publish-rust-sdk]
    runs-on: ubuntu-24.04
    environment: publish
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: symdev-build
          path: ${{ runner.temp }}/symdev-build

      - name: Unpack the build
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/symdev-build/symdev-out.tar"

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Publish symdev
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PUBLISH_PUBLIC_URL: ${{ vars.PUBLISH_PUBLIC_URL }}
          PUBLISH_ACCESS_KEY_ID: ${{ secrets.PUBLISH_ACCESS_KEY_ID }}
          PUBLISH_SECRET_ACCESS_KEY: ${{ secrets.PUBLISH_SECRET_ACCESS_KEY }}
          PUBLISH_SIGNING_KEY: ${{ secrets.PUBLISH_SIGNING_KEY }}
        run: |
          cargo run --release --locked -p publish -- public "symdev;$VERSION" \
            --from "$RUNNER_TEMP/out/symdev" \
            --source-code "$RUNNER_TEMP/out/symdev-$VERSION-source.tar.gz" \
            --recipe "recipes/symdev/$VERSION/recipe.toml"

      # Last, so `curl …/install.sh | sh` never meets an index without the symdev it installs.
      # Mutable by design, unlike the content-addressed archives: every upload replaces it,
      # and no-cache makes caches revalidate, so a fix reaches users on their next run. Served
      # as text/plain; charset=utf-8: a browser shows it to someone reading it before piping
      # it to sh (its comments hold UTF-8), and sh ignores the type.
      - name: Upload install.sh to the public bucket's root
        env:
          PUBLISH_PUBLIC_URL: ${{ vars.PUBLISH_PUBLIC_URL }}
          PUBLISH_ACCESS_KEY_ID: ${{ secrets.PUBLISH_ACCESS_KEY_ID }}
          PUBLISH_SECRET_ACCESS_KEY: ${{ secrets.PUBLISH_SECRET_ACCESS_KEY }}
        run: |
          cargo run --release --locked -p publish -- file install.sh --to install.sh \
            --bucket public --content-type "text/plain; charset=utf-8" \
            --cache-control no-cache

  # A manual run with install_sh_only: re-upload install.sh from the dispatched ref (the
  # environment admits main only) and nothing else. Not in the `publish` concurrency group:
  # it does not touch the index, and a pending job there would cancel a pending publish.
  install-sh:
    if: github.event_name == 'workflow_dispatch' && inputs.install_sh_only
    runs-on: ubuntu-24.04
    environment: publish
    concurrency:
      group: install-sh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      # Mutable by design; see the same step in publish-symdev.
      - name: Upload install.sh to the public bucket's root
        env:
          PUBLISH_PUBLIC_URL: ${{ vars.PUBLISH_PUBLIC_URL }}
          PUBLISH_ACCESS_KEY_ID: ${{ secrets.PUBLISH_ACCESS_KEY_ID }}
          PUBLISH_SECRET_ACCESS_KEY: ${{ secrets.PUBLISH_SECRET_ACCESS_KEY }}
        run: |
          cargo run --release --locked -p publish -- file install.sh --to install.sh \
            --bucket public --content-type "text/plain; charset=utf-8" \
            --cache-control no-cache
