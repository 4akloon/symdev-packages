# The repository's own tests, on every change to what they cover: tests/install.sh.test
# (install.sh against a fake bucket that `pkgtools serve` serves on 127.0.0.1, with an index
# written by `publish --dry-run`), tests/firmware-stage.test and tests/emulator-build.test (the
# firmware recipe's stage.sh and the emulator recipe's build.sh against fake inputs), and the
# cargo tests of the publisher (some read the real
# recipes) and of pkgtools (the notices generator, and the TARGET2 rewrite, runtime closure,
# case-fold and SDK checks that the recipes' scripts and symdev.yml use). Hermetic: no
# bucket, no secret, nothing leaves the runner.
name: tests

on:
  pull_request:
    paths:
      - "install.sh"
      - "tests/**"
      - "tools/**"
      - "recipes/**"
      - "publish/**"
      - "pkgtools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "tests/**"
      - "tools/**"
      - "recipes/**"
      - "publish/**"
      - "pkgtools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # install.sh.test needs openssl 3 (index signatures) and curl, and runs install.sh with
      # dash; with busybox it also runs it in a PATH of busybox applets (wget instead of curl,
      # no flock, no openssl). pkgtools' tests make their fixture archives with ar (binutils).
      # Only what this runner image lacks is installed.
      - name: Install what the tests need
        run: |
          missing=
          for tool in dash busybox curl ar openssl; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          echo "missing:${missing:- none}"
          if [ -n "$missing" ]; then
            packages=$(echo $missing | sed 's/\bar\b/binutils/')
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $packages
          fi

      # Pinned like symdev's CI (workspace rust-version); bump both together.
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Publisher and pkgtools tests
        run: cargo test --locked

      - name: install.sh under dash
        run: sh tests/install.sh.test "$(command -v dash)"

      - name: install.sh under bash
        run: sh tests/install.sh.test "$(command -v bash)"

      - name: The firmware recipe's stage.sh
        run: sh tests/firmware-stage.test

      - name: The emulator recipe's build.sh
        run: sh tests/emulator-build.test
