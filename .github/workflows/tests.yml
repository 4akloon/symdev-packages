# The repository's own tests, on every change to what they cover: tests/install.sh.test
# (install.sh against a fake bucket that `python3 -m http.server` serves on 127.0.0.1, with
# an index written by `publish --dry-run`), the unit tests of the Python tools (the notices
# generator, and the TARGET2 rewrite, runtime closure, case-fold and SDK checks that
# prebuilt.sh and symdev.yml use), and the publisher's cargo tests, some of which read the
# real recipes. Hermetic: no bucket, no secret, nothing leaves the runner.
name: tests

on:
  pull_request:
    paths:
      - "install.sh"
      - "tests/**"
      - "tools/**"
      - "recipes/**"
      - "publish/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "tests/**"
      - "tools/**"
      - "recipes/**"
      - "publish/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # install.sh.test needs python3 (the fake bucket) and openssl 3 (index signatures), and
      # runs install.sh with dash; with busybox it also runs it in a PATH of busybox applets
      # (wget instead of curl, no flock, no openssl). Only what this runner image lacks is
      # installed.
      - name: Install what the tests need
        run: |
          missing=
          for tool in python3 dash busybox curl ar openssl; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          echo "missing:${missing:- none}"
          if [ -n "$missing" ]; then
            packages=$(echo $missing | sed 's/\bar\b/binutils/')
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $packages
          fi

      # Pinned like symdev's CI (workspace rust-version); bump both together.
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Publisher tests
        run: cargo test --locked

      - name: install.sh under dash
        run: sh tests/install.sh.test "$(command -v dash)"

      - name: install.sh under bash
        run: sh tests/install.sh.test "$(command -v bash)"

      - name: Python tool tests
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
