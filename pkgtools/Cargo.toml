[package]
name = "pkgtools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The build checks of the symdev-packages pipeline: notices, TARGET2 rewrite, runtime closure, SDK case-fold overlay, SDK-free check."

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
