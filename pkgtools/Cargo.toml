[package]
name = "pkgtools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The build checks of the symdev-packages pipeline: notices, TARGET2 rewrite, runtime closure, SDK case-fold overlay, SDK-free check."

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
# symdev's R_ARM_TARGET2 rewrite (experiment 109), the one its rust-lld driver applies to the
# SDK's import libraries: taken by path from symdev's rl-driver worktree until symdev v0.3.0
# is tagged; the lead switches it to `git = "https://github.com/4akloon/symdev"` with that
# tag at the release. CI cannot build this line before then.
symdev-elf2e32 = { path = "../../../symdev/rl-driver/crates/symdev-elf2e32" }

[dev-dependencies]
tempfile = "3"
