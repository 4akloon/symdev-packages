[package]
name = "pkgtools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The build checks of the symdev-packages pipeline: notices, TARGET2 rewrite, runtime closure, SDK case-fold overlay, SDK-free check, emulator tree and notices."

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
# symdev's R_ARM_TARGET2 rewrite (experiment 109), the one its rust-lld driver applies to the
# SDK's import libraries.
symdev-elf2e32 = { git = "https://github.com/4akloon/symdev", tag = "v0.3.0" }
# Reads the glibc symbol versions an EKA2L1 AppImage's ELF files need (emulator-tree).
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "std"] }

[dev-dependencies]
tempfile = "3"
