[package]
name = "publish"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# symdev's package index types and `SignedIndex`, from the same tag as pkgtools' elf2e32.
symdev-sdk = { git = "https://github.com/4akloon/symdev", tag = "v0.3.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
sha2 = "0.10"
tempfile = "3"
